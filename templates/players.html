{% extends 'base.html' %}{% block content %}<h1>Players</h1><section class="card"><div class="tablewrap"><table><thead><tr><th>Internal ID</th><th>Telegram ID</th><th>Username</th><th>First name</th><th>Tickets</th><th>Joined (UTC)</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.id }}</td><td>{{ r.telegram_id }}</td><td>{{ r.username or '—' }}</td><td>{{ r.first_name }}</td><td>{{ r.tickets_count }}</td><td>{{ r.created_at }}</td></tr>{% else %}<tr><td colspan="6">No players yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}

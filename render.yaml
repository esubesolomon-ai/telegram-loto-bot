services:
  - type: web
    name: telegram-lottery-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: lottery-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/lottery.sqlite3
      - key: TELEBIRR_ENABLED
        value: "false"
      - key: LIVE_DRAWS_ENABLED
        value: "false"
      - key: APP_ENV
        value: production
